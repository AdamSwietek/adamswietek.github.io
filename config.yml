          title: Adam R. Swietek
          subtitle: >-
            I explore environmental externalities in cities. Combining
            spatial modeling, urban economics, and computational design, I examine how
            amenities and risks are produced, distributed, and priced within existing
            urban form—and assess the impacts of planned interventions and environmental
            shocks on communities and property markets. My work evaluates how zoning,
            planning, and building codes can mitigate externalities and protect people
            and assets, while exploring novel financial mechanisms to insure and hedge
            residual risk.
